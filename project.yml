name: RidePlay
options:
  bundleIdPrefix: com.rideplay
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  RidePlay:
    type: application
    platform: iOS
    sources:
      - path: RidePlay
        excludes:
          - "Info.plist"
          - "RidePlay.entitlements"
    resources:
      - RidePlay/Assets.xcassets
    info:
      path: RidePlay/App/Info.plist
    entitlements:
      path: RidePlay/RidePlay.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rideplay.app
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: RidePlay/RidePlay.entitlements
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: MediaPlayer.framework
      - sdk: AVFoundation.framework
      - sdk: CarPlay.framework
